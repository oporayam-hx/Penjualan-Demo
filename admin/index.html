<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Penjual — SembakoMart Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">🌾</div>
      <h1 class="login-title">SembakoMart Admin</h1>
      <p class="login-subtitle">Masuk untuk mengelola produk dan pesanan Anda</p>
      
      <div class="login-err" id="loginErr">Username atau password salah!</div>

      <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" class="form-input" id="username" placeholder="Contoh: admin" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-input" id="password" placeholder="••••••••" required>
        </div>
        
        <button type="submit" class="btn-admin-primary">
          🔓 Masuk ke Dashboard
        </button>
      </form>
    </div>
  </div>

  <script>
    // Check if already logged in
    if (localStorage.getItem('sembako_admin_logged_in') === 'true') {
      window.location.href = 'dashboard.html';
    }

    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const errEl = document.getElementById('loginErr');

      // Default Admin Credentials
      if (user === 'admin' && pass === 'sembako123') {
        localStorage.setItem('sembako_admin_logged_in', 'true');
        localStorage.setItem('sembako_admin_user', 'admin');
        window.location.href = 'dashboard.html';
      } else {
        errEl.style.display = 'block';
        setTimeout(() => {
          errEl.style.display = 'none';
        }, 3000);
      }
    }
  </script>
</body>
</html>
